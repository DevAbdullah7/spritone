<body>
    <!-- Navbar -->
    <header class="navbar" id="navbar">
        <!-- Navbar Header -->
        <div class="nav-header">
            <!-- Website Logo -->
            <a href="/" class="logo">
                <img src="/res/Logo.svg" alt="Website Logo">
            </a>

            <!-- Open & Close Navbar: Mobile Version -->
            <button class="menu-toggle" id="menuToggle" aria-label="قائمة التصفح">
                <!-- Open Icon -->
                <svg width="24" height="24" class="icon-open">
                    <use xlink:href="/assets/icons/sprites/icons.svg#menu"></use>
                </svg>

                <!-- Open Icon -->
                <svg width="24" height="24" class="icon-close">
                    <use xlink:href="/assets/icons/sprites/icons.svg#close"></use>
                </svg>
            </button>
        </div>

        <!-- Navbar Body -->
        <div class="nav-body">
            <ul class="nav-links">
                <li><a class="active" href="#">Generate</a></li>
                <li><a href="/#about">About</a></li>
                <li><a href="/#features">Features</a></li>
                <li><a href="/#how-it-works">How It Works</a></li>
            </ul>

            <div class="nav-footer">
                <button class="BTN Primary-BTN">Contact</button>
            </div>
        </div>

        <!-- Navbar UI Design Effect -->
        <div class="effect"></div>
    </header>

    <!-- Page Content -->
    <main class="main" id="main">
        <!-- Upload Section -->
        <div class="section upload-icons-container">
            <!-- File Input -->
            <div class="files-input">
                <!-- Drop Zone -->
                <div class="upload-box" id="dropZone">
                    <div class="upload-shape">
                        <svg width="64" height="64">
                            <use xlink:href="/assets/icons/sprites/icons.svg#upload2"></use>
                        </svg>
                        <div class="BTN Primary-BTN">
                            Browse
                        </div>
                    </div>
    
                    <div class="text-part">
                        <p class="h5">Upload or Drop Icons Here</p>
                        <p class="inputMSG"><span style="color: #ff0000;">*</span> File Supported: .svg</p>
                    </div>
                </div>
            
                <!-- Input -->
                <input type="file" accept="image/svg+xml" id="fileInput" multiple>
            </div>
        
            <!-- Uploaded Icons -->
            <div class="uploaded-icons">
                <div class="container">
                    <p>Uploaded Icons:</p>
    
                    <div class="checkBox">
                        <input type="checkbox" id="cleanSuffixesToggle" class="checkBoxInp">
                        <label for="cleanSuffixesToggle" class="checkBoxLabel">Suffixes</label>
                    </div>
                </div>
                
                <!-- Icons List -->
                <div class="icons-list" id="iconsList">
                    <svg width="48" height="48" style="color: #919191;">
                        <use xlink:href="/assets/icons/sprites/icons.svg#image"></use>
                    </svg>
                    <p class="orderMSG">Generate Your Icons Sprite Now !</p>
                </div>
    
                <!-- Icons Controlling -->
                <div class="icons-controlling">
                    <!-- Count Of Icons -->
                    <div class="icons-count">
                        <svg width="32" height="32">
                            <use xlink:href="/assets/icons/sprites/icons.svg#images"></use>
                        </svg>
                        <span id="count">0</span>
                    </div>
    
                    <!-- Action Call Buttons -->
                    <div class="action-call-buttons">
                        <!-- Clear -->
                        <div class="BTN Danger-BTN" onclick="clearSprite()">Clear</div>
                    </div>
                </div>
            </div>
        </div>
    
        <!-- Output Section -->
        <div class="section output-container">
            <!-- <h3>Output Code:</h3> -->
    
            <!-- SVG Sprite Code -->
            <div class="codeShown">
                <!-- <p class="codeTitle">Output Code:</p> -->
<pre id="output" class="language-markup">
                    
</pre>
                <span class="copyIcon" onclick="copyElement(this)">
                    <svg width="18" height="18">
                        <use xlink:href="/assets/icons/sprites/icons.svg#copy"></use>
                    </svg>
                </span>
            </div>
    
            <!-- Action Call Buttons -->
            <div class="action-call-buttons">
                <button class="BTN Primary-BTN" title="Download Sprite File" onclick="downloadSprite()">
                    <svg width="24" height="24">
                        <use xlink:href="/assets/icons/sprites/icons.svg#download2"></use>
                    </svg>
                </button>
            </div>
        </div>
    </main>
