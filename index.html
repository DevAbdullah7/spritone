<!DOCTYPE html>
<html lang="ar">
<head>
    <title>Spriteone</title>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- CSS Files -->
    <link rel="stylesheet" href="./assets/css/design-system.css">
    <link rel="stylesheet" href="./assets/css/main.css">
    <link rel="stylesheet" href="./assets/css/app.css">

    <!-- For Code's Theme -->
    <link href="https://cdn.jsdelivr.net/npm/prismjs/themes/prism-tomorrow.css" rel="stylesheet" />
</head>

<body>
    <nav class="navbar">
        <div class="nav-header">
            <!-- Website Logo -->
            <img src="/res/Logo.svg" alt="Website Logo" class="logo">

            <!-- Navbar open/close controlling -->
            <div class="nav-controlling">
                <svg width="24" height="24" class="open" onclick="document.querySelector('nav.navbar').classList.toggle('open')">
                    <use xlink:href="/assets/icons/sprites/icons.svg#menu"></use>
                </svg>

                <svg width="24" height="24" class="close" onclick="document.querySelector('nav.navbar').classList.toggle('open')">
                    <use xlink:href="/assets/icons/sprites/icons.svg#close"></use>
                </svg>
            </div>
        </div>

        <!-- Website Links -->
        <ul class="nav-links">
            <li><a href="#">Generate</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Features</a></li>
            <li><a href="#">How It Works</a></li>
        </ul>

        <!-- Button -->
        <button class="BTN Primary-BTN">Contact</button>

        <!-- UI Design Effect -->
        <div class="effect"></div>
    </nav>
    <!-- <h1>SVG Sprite Generator Pro</h1> -->

    <!-- Upload Section -->
    <div class="section upload-icons-container">
        <!-- File Input -->
        <div class="files-input">
            <!-- Drop Zone -->
            <div class="upload-box" id="dropZone">
                <div class="upload-shape">
                    <svg width="64" height="64">
                        <use xlink:href="./assets/icons/sprites/icons.svg#upload2"></use>
                    </svg>
                    <div class="BTN Primary-BTN">
                        Browse
                    </div>
                </div>

                <div class="text-part">
                    <p class="h5">Upload or Drop Icons Here</p>
                    <p class="inputMSG"><span style="color: #ff0000;">*</span> File Supported: .svg</p>
                </div>
            </div>
        
            <!-- Input -->
            <input type="file" accept="image/svg+xml" id="fileInput" multiple>
        </div>
    
        <!-- Uploaded Icons -->
        <div class="uploaded-icons">
            <h3>Uploaded Icons:</h3>
            
            <!-- Icons List -->
            <div class="icons-list" id="iconsList">
                <svg width="48" height="48" style="color: #919191;">
                    <use xlink:href="/assets/icons/sprites/icons.svg#image"></use>
                </svg>
                <p class="orderMSG">Generate Your Icons Sprite Now !</p>
            </div>

            <!-- Icons Controlling -->
            <div class="icons-controlling">
                <!-- Count Of Icons -->
                <div class="icons-count">
                    <svg width="32" height="32">
                        <use xlink:href="/assets/icons/sprites/icons.svg#images"></use>
                    </svg>
                    <span id="count">0</span>
                </div>

                <!-- Action Call Buttons -->
                <div class="action-call-buttons">
                    <!-- Clear -->
                    <div class="BTN Danger-BTN" onclick="clearSprite()">Clear</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Output Section -->
    <div class="section output-container">
        <!-- <h3>Output Code:</h3> -->

        <!-- SVG Sprite Code -->
        <div class="codeShown">
            <!-- <p class="codeTitle">Output Code:</p> -->
<pre id="output" class="language-markup">
    
</pre>
            <span class="copyIcon" onclick="copyElement(this)">
                <svg width="18" height="18">
                    <use xlink:href="/assets/icons/sprites/icons.svg#copy"></use>
                </svg>
            </span>
        </div>

        <!-- Action Call Buttons -->
        <div class="action-call-buttons">
            <button class="BTN Primary-BTN" title="Download Sprite File" onclick="downloadSprite()">Download</button>
        </div>
    </div>

    <div class="bubble"></div>

    <script src="./assets/js/app.js"></script>
    <script src="./assets/js/Design-System.js"></script>

    <!-- For Code Theme -->
    <script src="https://cdn.jsdelivr.net/npm/prismjs/prism.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs/components/prism-markup.min.js"></script>

</body>
</html>
